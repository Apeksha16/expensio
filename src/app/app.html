<main
  [@routeAnimations]="getAnimationData()"
  class="relative overflow-x-hidden h-full w-full bg-black"
>
  <router-outlet></router-outlet>
  <app-toast></app-toast>
</main>

@if (!appInitService.isReady()) {
  <div @fadeOut class="fixed inset-0 z-[10000] bg-white flex flex-col items-center justify-center pointer-events-none">
    <div class="flex-1 flex flex-col items-center justify-center w-full">
      <div class="w-24 h-24 bg-[#5421E6] rounded-[28px] flex items-center justify-center mb-6 shadow-xl shadow-[#5421E6]/30">
        <!-- Assuming logo.png is the M logo or similar. In the design it's a black rounded square with purple M -->
        <img src="logo.png" alt="Expensio Logo" class="w-16 h-16 object-contain" />
      </div>
      <h1 class="text-4xl font-extrabold text-black mb-2 tracking-tight">
        Expensio
      </h1>
      <p class="text-gray-500 font-medium text-sm">
        Your life. Organized.
      </p>
    </div>
    
    <div class="mb-12">
      <svg class="w-8 h-8 animate-[spin_1s_steps(8)_infinite] text-indigo-600" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <circle cx="12" cy="4" r="2" fill="currentColor" class="opacity-100"></circle>
        <circle cx="17.66" cy="6.34" r="2" fill="currentColor" class="opacity-80"></circle>
        <circle cx="20" cy="12" r="2" fill="currentColor" class="opacity-60"></circle>
        <circle cx="17.66" cy="17.66" r="2" fill="currentColor" class="opacity-40"></circle>
        <circle cx="12" cy="20" r="2" fill="currentColor" class="opacity-20"></circle>
        <circle cx="6.34" cy="17.66" r="2" fill="currentColor" class="opacity-10"></circle>
        <circle cx="4" cy="12" r="2" fill="currentColor" class="opacity-10"></circle>
        <circle cx="6.34" cy="6.34" r="2" fill="currentColor" class="opacity-10"></circle>
      </svg>
    </div>
  </div>
}

<!-- Global hidden input for iOS keyboard hack -->
<input #globalHiddenInput type="text" class="fixed opacity-0 pointer-events-none -z-50 -left-[9999px] -top-[9999px]" />

<!-- Offline Overlay -->
@if (pwaService.isOffline()) {
  <div
    class="fixed inset-0 z-[10000] bg-white/95 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-black text-center transition-opacity duration-300"
  >
    <div
      class="w-32 h-32 mb-8 bg-red-50 flex items-center justify-center rounded-full shadow-inner"
    >
      <div class="w-24 h-24 bg-red-100 rounded-full flex items-center justify-center shadow-sm">
        <svg
          class="w-12 h-12 text-red-500"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 3l18 18M9.9 4.25l1.63-1.63a1.5 1.5 0 012.12 0l7.25 7.25a1.5 1.5 0 010 2.12l-1.63 1.63M4.25 9.9l-1.63 1.63a1.5 1.5 0 000 2.12l7.25 7.25a1.5 1.5 0 002.12 0l1.63-1.63"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M8.25 10.5l-1.5 1.5a1.5 1.5 0 000 2.12l4.5 4.5a1.5 1.5 0 002.12 0l1.5-1.5"
          />
        </svg>
      </div>
    </div>
    <h2 class="text-3xl font-extrabold tracking-tight mb-3 text-gray-900">You're Offline</h2>
    <p class="text-gray-500 font-medium text-sm max-w-[260px] leading-relaxed">
      Expensio requires an internet connection to sync your data. Reconnect to the network to
      continue.
    </p>
    <div
      class="mt-10 flex items-center justify-center gap-3 bg-white border border-gray-100 rounded-full py-3 px-6 shadow-[0_8px_30px_rgb(0,0,0,0.12)]"
    >
      <div class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse shadow-[0_0_8px_rgba(239,68,68,0.5)]"></div>
      <span class="text-[11px] font-extrabold uppercase tracking-widest text-gray-600"
        >Waiting for connection...</span
      >
    </div>
  </div>
}
