<main [@routeAnimations]="getAnimationData()" class="relative overflow-x-hidden min-h-screen w-full bg-black">
  <router-outlet></router-outlet>
</main>


<!-- Offline Overlay -->
<div 
  *ngIf="pwaService.isOffline()" 
  class="fixed inset-0 z-[10000] bg-white flex flex-col items-center justify-center p-6 text-black text-center transition-opacity duration-300"
>
  <div class="w-32 h-32 mb-8 bg-gray-200 border-2 border-black flex items-center justify-center rounded-none shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">
    <svg class="w-16 h-16 text-black" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" d="M3 3l18 18M9.9 4.25l1.63-1.63a1.5 1.5 0 012.12 0l7.25 7.25a1.5 1.5 0 010 2.12l-1.63 1.63M4.25 9.9l-1.63 1.63a1.5 1.5 0 000 2.12l7.25 7.25a1.5 1.5 0 002.12 0l1.63-1.63" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 10.5l-1.5 1.5a1.5 1.5 0 000 2.12l4.5 4.5a1.5 1.5 0 002.12 0l1.5-1.5" />
    </svg>
  </div>
  <h2 class="text-4xl font-extrabold tracking-tight mb-4 uppercase">You're Offline</h2>
  <p class="text-gray-600 font-bold text-lg max-w-xs leading-relaxed">
    Expensio requires an internet connection to sync your data. Reconnect to the network to continue.
  </p>
  
  <div class="mt-12 flex items-center justify-center gap-3 bg-red-100 border-2 border-red-500 py-3 px-6 shadow-[4px_4px_0px_0px_rgba(239,68,68,1)]">
    <div class="w-3 h-3 rounded-none bg-red-500 animate-pulse border border-red-700"></div>
    <span class="text-sm font-extrabold uppercase tracking-widest text-red-700">Waiting for connection...</span>
  </div>
</div>
