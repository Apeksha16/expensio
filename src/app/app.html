<main
  [@routeAnimations]="getAnimationData()"
  class="relative overflow-x-hidden h-full w-full bg-black"
>
  <router-outlet></router-outlet>
  <app-toast></app-toast>
</main>

@if (!appInitService.isReady()) {
  <div @fadeOut class="fixed inset-0 z-[10000] bg-[#FAFAFA] flex flex-col justify-end items-center pointer-events-none font-sans pb-[12vh]">
    
    <!-- Content container -->
    <div class="flex flex-col items-center">
      
      <!-- Premium Logo Container -->
      <div class="relative w-24 h-24 mb-8 rounded-[28px] bg-white shadow-[0_16px_40px_rgba(79,70,229,0.15)] flex items-center justify-center border border-indigo-50/50">
        <!-- Subtle inner glow -->
        <div class="absolute inset-0 rounded-[28px] shadow-inner bg-gradient-to-tr from-indigo-50/50 to-transparent"></div>
        <img src="expensio-logo-2.png" alt="Expensio Logo" width="80" height="80" class="w-[80%] h-[80%] object-contain drop-shadow-sm z-10" />
      </div>
      
      <!-- Premium Typography -->
      <h1 class="text-[40px] font-[800] text-slate-900 tracking-tight mb-2">
        Expensio
      </h1>
      <p class="text-indigo-600/80 font-bold text-[12px] tracking-[0.2em] uppercase">
        Expenses made simple
      </p>
      
    </div>
  </div>
}

<!-- Global hidden input for iOS keyboard hack -->
<input #globalHiddenInput type="text" class="fixed opacity-0 pointer-events-none -z-50 -left-[9999px] -top-[9999px]" />

<!-- Offline Overlay -->
@if (pwaService.isOffline()) {
  <div
    class="fixed inset-0 z-[10000] bg-white/95 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-black text-center transition-opacity duration-300"
  >
    <div
      class="w-32 h-32 mb-8 bg-red-50 flex items-center justify-center rounded-full shadow-inner"
    >
      <div class="w-24 h-24 bg-red-100 rounded-full flex items-center justify-center shadow-sm">
        <svg
          class="w-12 h-12 text-red-500"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 3l18 18M9.9 4.25l1.63-1.63a1.5 1.5 0 012.12 0l7.25 7.25a1.5 1.5 0 010 2.12l-1.63 1.63M4.25 9.9l-1.63 1.63a1.5 1.5 0 000 2.12l7.25 7.25a1.5 1.5 0 002.12 0l1.63-1.63"
          />
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M8.25 10.5l-1.5 1.5a1.5 1.5 0 000 2.12l4.5 4.5a1.5 1.5 0 002.12 0l1.5-1.5"
          />
        </svg>
      </div>
    </div>
    <h2 class="text-3xl font-extrabold tracking-tight mb-3 text-gray-900">You're Offline</h2>
    <p class="text-gray-500 font-medium text-sm max-w-[260px] leading-relaxed">
      Expensio requires an internet connection to sync your data. Reconnect to the network to
      continue.
    </p>
    <div
      class="mt-10 flex items-center justify-center gap-3 bg-white border border-gray-100 rounded-full py-3 px-6 shadow-[0_8px_30px_rgb(0,0,0,0.12)]"
    >
      <div class="w-2.5 h-2.5 rounded-full bg-red-500 animate-pulse shadow-[0_0_8px_rgba(239,68,68,0.5)]"></div>
      <span class="text-[11px] font-extrabold uppercase tracking-widest text-gray-600"
        >Waiting for connection...</span
      >
    </div>
  </div>
}
