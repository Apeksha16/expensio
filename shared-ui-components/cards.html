<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cards Component</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8 font-sans">
  <div class="max-w-5xl mx-auto space-y-12">
    <h1 class="text-2xl font-bold mb-4">Cards Component</h1>

    <!-- Stats Cards -->
    <section>
      <h2 class="text-lg font-semibold text-gray-900 mb-4">Stats Cards</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
        
        <!-- Hoverable Stat Card -->
        <a href="#" class="bg-white p-5 border border-gray-200 hover:border-[#1a2e22] transition-colors relative group cursor-pointer block">
          <div class="flex justify-between items-start">
            <div>
              <p class="text-xs font-semibold text-green-500 uppercase tracking-widest">Total Sales</p>
              <h3 class="text-2xl font-bold text-green-600 mt-1">₹50,000.00</h3>
            </div>
          </div>
        </a>

        <!-- Normal Stat Card (Non-clickable) -->
        <div class="bg-white p-5 border border-gray-200 block">
          <div class="flex justify-between items-start">
            <div>
              <p class="text-xs font-semibold text-gray-400 uppercase tracking-widest">Business Standing</p>
              <h3 class="text-2xl font-bold mt-1 text-gray-900">₹12,400.00</h3>
            </div>
          </div>
        </div>

      </div>
    </section>

    <!-- Quick Action Cards -->
    <section>
      <h2 class="text-lg font-semibold text-gray-900 mb-4">Quick Action Cards</h2>
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 sm:gap-6">
        
        <!-- Normal Action Card -->
        <a href="#" class="quick-action-card bg-white border border-gray-200 p-4 flex flex-col items-center justify-center gap-3 transition-all group h-full hover:border-[#1a2e22]">
          <div class="quick-action-card__icon w-10 h-10 bg-gray-50 flex items-center justify-center text-[#1a2e22] transition-colors group-hover:bg-[#1a2e22] group-hover:text-white">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
            </svg>
          </div>
          <h3 class="text-sm font-medium text-gray-700 transition-colors text-center leading-tight group-hover:text-[#1a2e22]">Add New</h3>
        </a>

        <!-- Disabled Action Card -->
        <a href="#" class="opacity-50 pointer-events-none cursor-not-allowed quick-action-card bg-white border border-gray-200 p-4 flex flex-col items-center justify-center gap-3 transition-all group h-full">
          <div class="quick-action-card__icon w-10 h-10 bg-gray-50 flex items-center justify-center text-[#1a2e22] transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
          </div>
          <h3 class="text-sm font-medium text-gray-700 transition-colors text-center leading-tight">Flash Deal</h3>
          <span class="text-[10px] uppercase font-bold text-gray-400 bg-gray-50 px-1.5 py-0.5 mt-[-4px]">Disabled</span>
        </a>

      </div>
    </section>

    <!-- Highlighted Card -->
    <section>
      <h2 class="text-lg font-semibold text-gray-900 mb-4">Highlighted Total Card</h2>
      <div class="max-w-sm bg-green-50 border border-green-100 p-6 rounded-sm flex flex-col items-center text-center shadow-sm">
        <h1 class="text-lg font-bold text-gray-900 mb-1">Sales</h1>
        <span class="text-xs font-semibold text-green-600 uppercase tracking-wider mb-2">Total Revenue</span>
        <span class="text-3xl font-bold text-gray-900">₹1,24,500.00</span>
      </div>
    </section>

  </div>
</body>
</html>
