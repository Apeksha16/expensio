<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input Box Component</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Remove number input spin buttons */
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
      display: none;
      opacity: 0;
      pointer-events: none;
    }
    input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }
  </style>
</head>
<body class="bg-gray-50 p-8 font-sans">
  <div class="max-w-md mx-auto space-y-8 bg-white p-8 border border-gray-200">
    <h1 class="text-2xl font-bold mb-4">Input Box Component</h1>

    <!-- Normal Input -->
    <div class="flex flex-col gap-1">
      <label class="text-[11px] font-semibold text-gray-500 tracking-widest uppercase">First Name</label>
      <div class="relative group">
        <input
          type="text"
          placeholder="e.g. John"
          class="w-full bg-white border-2 border-gray-200 text-gray-900 text-sm rounded-none focus:ring-0 focus:border-[#1a2e22] block p-2.5 outline-none transition-all placeholder-gray-300 hover:border-gray-300 min-h-[44px] touch-manipulation font-sans"
        />
      </div>
      <p class="text-[10px] text-gray-400">Please enter your legal first name.</p>
    </div>

    <!-- Disabled Input -->
    <div class="flex flex-col gap-1">
      <label class="text-[11px] font-semibold text-gray-500 tracking-widest uppercase">Username (Disabled)</label>
      <div class="relative group">
        <input
          type="text"
          value="johndoe123"
          disabled
          class="w-full bg-white border-2 border-gray-200 text-gray-900 text-sm rounded-none focus:ring-0 focus:border-[#1a2e22] block p-2.5 outline-none transition-all placeholder-gray-300 hover:border-gray-300 min-h-[44px] touch-manipulation font-sans opacity-50 cursor-not-allowed bg-gray-50"
        />
      </div>
    </div>

    <!-- Error State Input -->
    <div class="flex flex-col gap-1">
      <label class="text-[11px] font-semibold text-gray-500 tracking-widest uppercase">Email Address</label>
      <div class="relative group">
        <input
          type="email"
          value="invalid-email"
          class="w-full bg-white border-2 border-red-500 text-gray-900 text-sm rounded-none focus:ring-0 focus:border-red-500 block p-2.5 outline-none transition-all placeholder-gray-300 hover:border-red-500 min-h-[44px] touch-manipulation font-sans"
        />
      </div>
      <p class="text-xs text-red-500 mt-0.5">Please enter a valid email address.</p>
    </div>

    <!-- Input with Prefix & Suffix -->
    <div class="flex flex-col gap-1">
      <label class="text-[11px] font-semibold text-gray-500 tracking-widest uppercase">Amount</label>
      <div class="relative group">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <span class="text-gray-500 font-medium">₹</span>
        </div>
        <input
          type="number"
          placeholder="0.00"
          class="w-full bg-white border-2 border-gray-200 text-gray-900 text-sm rounded-none focus:ring-0 focus:border-[#1a2e22] block p-2.5 outline-none transition-all placeholder-gray-300 hover:border-gray-300 min-h-[44px] touch-manipulation font-sans pl-12 pr-12"
        />
        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
          <span class="text-gray-400 text-xs">INR</span>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
