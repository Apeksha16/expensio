<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neobrutalist Dropdown Select</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .animate-fade-in-up {
      animation: fadeInUp 0.15s ease-out forwards;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-[#f8fafc] p-8 text-[#0f172a] h-screen">
  <div class="max-w-md mx-auto space-y-8 bg-white p-8 border-2 border-black h-full relative">
    <div>
      <h1 class="text-3xl font-extrabold tracking-tight uppercase">Select Menu</h1>
      <p class="text-gray-500 font-semibold mt-1">Expensio Neobrutalist Dropdown Component</p>
    </div>

    <!-- Single Select Dropdown -->
    <div class="flex flex-col gap-2 relative z-10" id="dropdown-container">
      <label class="text-xs font-bold text-gray-700 uppercase tracking-wider">Select Category</label>
      
      <!-- Backdrop (Invisible click detector) -->
      <div id="backdrop" class="fixed inset-0 z-40 bg-transparent hidden" aria-hidden="true"></div>
      
      <div class="relative">
        <!-- Trigger Button -->
        <button
          id="trigger-btn"
          type="button"
          class="w-full bg-gray-50 border-2 border-black text-black text-sm rounded-none focus:outline-none flex items-center justify-between p-3 font-bold transition-all hover:bg-gray-100 min-h-[44px]"
        >
          <span id="selected-text" class="text-gray-500 truncate pr-2">Choose category...</span>
          <svg id="chevron-icon" class="w-4 h-4 text-black transition-transform duration-200 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
          </svg>
        </button>

        <!-- Dropdown Options -->
        <div id="dropdown-menu" class="hidden absolute left-0 right-0 top-full mt-1.5 z-50 bg-white border-2 border-black rounded-none shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] max-h-60 overflow-auto animate-fade-in-up">
          <ul class="py-1">
            <li>
              <button type="button" class="option-btn w-full text-left px-4 py-3 text-xs font-bold uppercase tracking-wider hover:bg-gray-100 flex items-center justify-between group transition-colors focus:outline-none text-gray-700">
                <span>Food & Dining</span>
              </button>
            </li>
            <li>
              <button type="button" class="option-btn w-full text-left px-4 py-3 text-xs font-bold uppercase tracking-wider hover:bg-gray-100 flex items-center justify-between group transition-colors focus:outline-none text-gray-700">
                <span>Entertainment</span>
              </button>
            </li>
            <li>
              <button type="button" class="option-btn w-full text-left px-4 py-3 text-xs font-bold uppercase tracking-wider hover:bg-gray-100 flex items-center justify-between group transition-colors focus:outline-none text-gray-700">
                <span>Utilities</span>
              </button>
            </li>
            <li>
              <button type="button" class="option-btn w-full text-left px-4 py-3 text-xs font-bold uppercase tracking-wider hover:bg-gray-100 flex items-center justify-between group transition-colors focus:outline-none text-[#1a2e22] bg-gray-100">
                <span>Travel & Transport (Active)</span>
                <svg class="w-4 h-4 text-[#1a2e22] flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                </svg>
              </button>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <!-- Disabled State -->
    <div class="flex flex-col gap-2 relative z-0">
      <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Payment Mode (Disabled)</label>
      <div class="relative">
        <button
          type="button"
          disabled
          class="w-full bg-gray-100 border-2 border-gray-300 text-gray-400 text-sm rounded-none flex items-center justify-between p-3 font-bold cursor-not-allowed opacity-60 min-h-[44px]"
        >
          <span class="truncate pr-2">UPI Payment</span>
          <svg class="w-4 h-4 text-gray-300 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    const triggerBtn = document.getElementById('trigger-btn');
    const dropdownMenu = document.getElementById('dropdown-menu');
    const chevronIcon = document.getElementById('chevron-icon');
    const backdrop = document.getElementById('backdrop');
    const optionBtns = document.querySelectorAll('.option-btn');
    const selectedText = document.getElementById('selected-text');

    let isOpen = false;

    function toggleDropdown() {
      isOpen = !isOpen;
      if (isOpen) {
        dropdownMenu.classList.remove('hidden');
        backdrop.classList.remove('hidden');
        chevronIcon.classList.add('rotate-180');
      } else {
        dropdownMenu.classList.add('hidden');
        backdrop.classList.add('hidden');
        chevronIcon.classList.remove('rotate-180');
      }
    }

    triggerBtn.addEventListener('click', toggleDropdown);
    backdrop.addEventListener('click', toggleDropdown);

    optionBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        const textSpan = btn.querySelector('span');
        selectedText.textContent = textSpan.textContent.replace(' (Active)', '');
        selectedText.classList.remove('text-gray-500');
        selectedText.classList.add('text-black');
        toggleDropdown();
      });
    });
  </script>
</body>
</html>
