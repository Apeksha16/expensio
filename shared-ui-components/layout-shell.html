<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neobrutalist App Shell Layout</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-black h-screen overflow-hidden m-0 p-0 select-none">

  <!-- Main Layout Wrapper -->
  <div class="h-full flex flex-col relative w-full overflow-hidden">
    
    <!-- Top Header (Height 56px / h-14) -->
    <header class="fixed top-0 w-full z-30 flex items-center justify-between px-4 h-14 bg-[#3b82f6] text-white">
      <!-- Menu Drawer Toggle -->
      <button onclick="toggleSidebar(true)" class="p-2 -ml-2 text-white/80 hover:text-white focus:outline-none transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

      <span class="text-lg font-extrabold tracking-tight uppercase">Expenses</span>

      <!-- Right side action spacer -->
      <div class="w-8"></div>
    </header>

    <!-- Sidebar Overlay -->
    <div id="sidebar-backdrop" onclick="toggleSidebar(false)" class="fixed inset-0 bg-black/40 z-40 hidden transition-opacity"></div>

    <!-- Sidebar Drawer -->
    <aside id="sidebar-drawer" class="fixed inset-y-0 left-0 z-50 w-64 bg-white border-r-2 border-black transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
      <div class="h-14 flex items-center px-6 border-b-2 border-black bg-gray-100">
        <span class="text-xl font-extrabold tracking-tight text-black">apex_coder</span>
      </div>

      <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-none font-bold text-gray-600 hover:bg-gray-100 hover:text-black">
          <span class="text-xs uppercase tracking-wider">Dashboard</span>
        </a>
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-none font-bold text-black bg-blue-50 border-l-4 border-blue-500">
          <span class="text-xs uppercase tracking-wider">Expenses</span>
        </a>
      </nav>
    </aside>

    <!-- Main Content Panel (Scrolls under header/footer) -->
    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-[#f8fafc] pt-14 pb-24 px-4">
      <div class="py-6 space-y-4">
        <div class="bg-white border-2 border-black p-6 rounded-none shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
          <h3 class="text-lg font-extrabold uppercase">Main Page Content</h3>
          <p class="text-gray-500 font-semibold mt-1">Scrollable body area of the application shell.</p>
        </div>
      </div>
    </main>

    <!-- Floating Action Button (FAB) -->
    <button class="fixed right-4 w-14 h-14 text-white bg-[#3b82f6] border-2 border-black rounded-none flex items-center justify-center z-40 hover:bg-white hover:text-[#3b82f6] transition-colors duration-200 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:scale-95" style="bottom: 6.5rem;">
      <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
    </button>

    <!-- Floating Bottom Navigation Bar (floats 24px above screen) -->
    <nav class="fixed left-4 right-4 bg-white border-2 border-black z-30 rounded-none overflow-hidden" style="bottom: 1.5rem;">
      <div class="flex justify-between items-center h-16 w-full p-1.5 gap-1.5">
        
        <!-- Tab 1 -->
        <a href="#" class="flex items-center justify-center w-full h-full text-gray-400 hover:text-black hover:bg-gray-100 transition-colors">
          <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6z" />
          </svg>
        </a>

        <!-- Tab 2 (Active context) -->
        <a href="#" class="flex items-center justify-center w-full h-full text-black bg-gray-100 border-2 border-black">
          <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0115.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75" />
          </svg>
        </a>

        <!-- Tab 3 -->
        <a href="#" class="flex items-center justify-center w-full h-full text-gray-400 hover:text-black hover:bg-gray-100 transition-colors">
          <svg class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6a7.5 7.5 0 107.5 7.5h-7.5V6z" />
          </svg>
        </a>

      </div>
    </nav>

  </div>

  <script>
    const drawer = document.getElementById('sidebar-drawer');
    const backdrop = document.getElementById('sidebar-backdrop');

    function toggleSidebar(open) {
      if (open) {
        drawer.classList.remove('-translate-x-full');
        backdrop.classList.remove('hidden');
      } else {
        drawer.classList.add('-translate-x-full');
        backdrop.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
