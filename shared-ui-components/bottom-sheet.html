<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neobrutalist Bottom Sheet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .bottom-sheet {
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }
  </style>
</head>
<body class="bg-[#f8fafc] p-8 text-[#0f172a] h-screen overflow-hidden">
  
  <div class="max-w-4xl mx-auto space-y-6">
    <h1 class="text-3xl font-extrabold uppercase">Bottom Sheet</h1>
    <p class="text-gray-500 font-semibold">Touch-native Bottom Sheet Component with swipe-down-to-close physics.</p>
    
    <button onclick="openSheet()" class="font-bold rounded-none px-6 py-3 bg-[#3b82f6] text-white border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:bg-[#1d4ed8]">
      Open Bottom Sheet
    </button>
  </div>

  <!-- Sheet Component Root -->
  <div id="sheet-overlay" class="fixed inset-0 z-50 hidden">
    <!-- Backdrop Blur -->
    <div id="sheet-backdrop" onclick="closeSheet()" class="fixed inset-0 bg-black/60 backdrop-blur-sm transition-opacity duration-300"></div>

    <!-- Sheet Panel -->
    <div
      id="bottom-sheet"
      class="bottom-sheet fixed bottom-0 left-0 right-0 bg-black z-50 max-h-[95vh] flex flex-col border-t-2 border-black translate-y-full touch-none"
    >
      <!-- Sheet Header (Module colored: e.g. Expense Blue) -->
      <div class="flex justify-between items-center py-4 px-6 bg-[#3b82f6] border-b-2 border-black text-white sticky top-0 z-10 select-none">
        <h2 class="text-xl font-extrabold tracking-tight uppercase">Add Expense</h2>
        
        <button onclick="closeSheet()" class="p-1 border-2 border-white hover:bg-white hover:text-[#3b82f6] transition-colors rounded-none">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Scrollable Sheet Content -->
      <div id="sheet-content" class="overflow-y-auto p-6 space-y-6 bg-black text-white max-h-[70vh]">
        
        <!-- Form elements go here -->
        <div class="flex flex-col gap-2">
          <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Title / Description</label>
          <input type="text" placeholder="e.g. Spotify Family Plan" class="bg-gray-900 border-b-2 border-gray-600 text-white p-3 rounded-none focus:outline-none focus:border-white font-bold" />
        </div>

        <div class="flex flex-col gap-2">
          <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Amount (₹)</label>
          <input type="text" placeholder="0.00" class="bg-gray-900 border-b-2 border-gray-600 text-white p-3 rounded-none focus:outline-none focus:border-white font-bold" />
        </div>

        <div class="pt-4">
          <button onclick="closeSheet()" class="font-medium rounded-none flex justify-center items-center px-4 py-3 text-sm min-h-[44px] bg-[#1a2e22] hover:bg-[#2f4d3b] text-white focus:outline-none w-full">
            Save Transaction
          </button>
        </div>

      </div>
    </div>
  </div>

  <script>
    const overlay = document.getElementById('sheet-overlay');
    const sheet = document.getElementById('bottom-sheet');
    const content = document.getElementById('sheet-content');

    function openSheet() {
      overlay.classList.remove('hidden');
      // Trigger slide animation in next tick
      setTimeout(() => {
        sheet.style.transform = 'translateY(0)';
      }, 20);
    }

    function closeSheet() {
      sheet.style.transform = 'translateY(100%)';
      // Hide container after transition completes
      setTimeout(() => {
        overlay.classList.add('hidden');
      }, 300);
    }

    // Touch-Native Swipe-To-Close Implementation
    let startY = 0;
    let currentY = 0;
    let isDragging = false;
    const threshold = 100;

    sheet.addEventListener('touchstart', (e) => {
      // Don't drag if focused on inputs
      if (document.activeElement.tagName === 'INPUT') return;
      // Don't drag if content element is scrolled down
      if (content.scrollTop > 0) return;

      startY = e.touches[0].clientY;
      currentY = 0;
      isDragging = true;
      sheet.style.transition = 'none';
    });

    sheet.addEventListener('touchmove', (e) => {
      if (!isDragging) return;

      const y = e.touches[0].clientY;
      const deltaY = y - startY;

      // Disable drag upward (deltaY < 0)
      if (deltaY < 0) {
        isDragging = false;
        sheet.style.transition = 'transform 0.3s cubic-bezier(0.32, 0.72, 0, 1)';
        sheet.style.transform = 'translateY(0)';
        return;
      }

      currentY = deltaY;
      
      // Add rubber band resistance effect after threshold
      let transformY = currentY;
      if (transformY > threshold) {
        const extra = transformY - threshold;
        transformY = threshold + (extra * 0.4);
      }

      sheet.style.transform = `translateY(${transformY}px)`;
      e.preventDefault();
    });

    sheet.addEventListener('touchend', () => {
      if (!isDragging) return;
      isDragging = false;
      sheet.style.transition = 'transform 0.3s cubic-bezier(0.32, 0.72, 0, 1)';

      if (currentY > threshold) {
        closeSheet();
      } else {
        sheet.style.transform = 'translateY(0)';
      }
    });
  </script>
</body>
</html>
