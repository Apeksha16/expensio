<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List Menu (Sidebar Navigation) Component</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans h-screen">

  <div class="flex h-full">
    <!-- Sidebar -->
    <div class="w-64 bg-white dark:bg-gray-900 shadow-xl h-full flex flex-col border-r border-gray-100 dark:border-gray-800">
      
      <!-- Logo Area -->
      <div class="h-16 flex items-center px-8 border-b border-gray-100 dark:border-gray-800">
        <div class="flex items-center gap-2 text-indigo-600 dark:text-indigo-400 font-bold text-xl">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="7" height="9" x="3" y="3" rx="1" />
            <rect width="7" height="5" x="14" y="3" rx="1" />
            <rect width="7" height="9" x="14" y="12" rx="1" />
            <rect width="7" height="5" x="3" y="16" rx="1" />
          </svg>
          <span>Print The Odds</span>
        </div>
      </div>

      <!-- Navigation Links -->
      <nav class="flex-1 px-4 py-6 space-y-1 overflow-y-auto">
        
        <!-- Active Link -->
        <a href="#" class="bg-indigo-50 dark:bg-gray-800 text-indigo-600 dark:text-indigo-400 flex items-center gap-3 px-4 py-3 rounded-xl transition-colors group">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="7" height="9"></rect>
            <rect x="14" y="3" width="7" height="5"></rect>
            <rect x="14" y="12" width="7" height="9"></rect>
            <rect x="3" y="16" width="7" height="5"></rect>
          </svg>
          <span class="font-medium">Dashboard (Active)</span>
        </a>

        <!-- Normal Link (Hoverable) -->
        <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-600 dark:text-gray-400 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-800 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors group">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="transition-colors group-hover:text-indigo-600 dark:group-hover:text-indigo-400">
            <circle cx="9" cy="21" r="1" />
            <circle cx="20" cy="21" r="1" />
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
          </svg>
          <span class="font-medium">Checkout (Hover Me)</span>
        </a>

        <!-- Normal Link -->
        <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-600 dark:text-gray-400 rounded-xl hover:bg-gray-50 dark:hover:bg-gray-800 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors group">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="transition-colors group-hover:text-indigo-600 dark:group-hover:text-indigo-400">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <polyline points="14 2 14 8 20 8" />
            <line x1="16" y1="13" x2="8" y2="13" />
            <line x1="16" y1="17" x2="8" y2="17" />
            <polyline points="10 9 9 9 8 9" />
          </svg>
          <span class="font-medium">Invoices</span>
        </a>

      </nav>

      <!-- Bottom Actions -->
      <div class="p-4 border-t border-gray-100">
        <div class="px-4 py-3 rounded-xl bg-gray-50 hover:bg-gray-100 transition-colors cursor-pointer flex items-center gap-3">
          <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 text-xs font-bold">JD</div>
          <div class="flex-1 overflow-hidden">
            <div class="text-sm font-semibold text-gray-900 truncate">John Doe</div>
            <div class="text-xs text-gray-500 truncate">john@untlip.com</div>
          </div>
        </div>
      </div>

    </div>

    <!-- Main Content Area -->
    <div class="flex-1 p-10">
      <h2 class="text-2xl font-bold text-gray-800">List Menu Display</h2>
      <p class="text-gray-600 mt-2">The sidebar on the left demonstrates the list menu component with hover, active, and focus states.</p>
    </div>
  </div>

</body>
</html>
