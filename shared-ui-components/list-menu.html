<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neobrutalist Navigation Drawer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 font-sans h-screen overflow-hidden">

  <div class="flex h-full relative">
    
    <!-- Sidebar / Drawer Container (Expensio style) -->
    <aside class="w-64 bg-white h-full flex flex-col border-r-2 border-black z-30">
      
      <!-- Drawer Header -->
      <div class="h-14 flex items-center px-6 border-b-2 border-black bg-gray-100">
        <span class="text-lg font-extrabold tracking-tight text-black">apex_coder</span>
      </div>

      <!-- Navigation List -->
      <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
        
        <!-- Active Nav Item (Themed active color border left-4) -->
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-none font-bold text-black bg-blue-50 border-l-4 border-blue-500 transition-colors">
          <svg class="w-5 h-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
          <span class="text-xs uppercase tracking-wider">Dashboard</span>
        </a>

        <!-- Normal Nav Item (Hoverable) -->
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-none font-bold text-gray-500 border-l-4 border-transparent hover:bg-gray-100 hover:text-black transition-all">
          <svg class="w-5 h-5 text-current" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <span class="text-xs uppercase tracking-wider">Expenses</span>
        </a>

        <!-- Budget Nav Item (Hoverable) -->
        <a href="#" class="flex items-center gap-3 px-3 py-2.5 rounded-none font-bold text-gray-500 border-l-4 border-transparent hover:bg-gray-100 hover:text-black transition-all">
          <svg class="w-5 h-5 text-current" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 3.055A9.003 9.003 0 1020.945 13H11V3.055z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z" />
          </svg>
          <span class="text-xs uppercase tracking-wider">Budgets</span>
        </a>

      </nav>

      <!-- Bottom Toolbar -->
      <div class="p-4 border-t-2 border-black mt-auto flex items-center justify-between bg-white">
        <span class="text-[10px] font-extrabold tracking-widest text-gray-400 uppercase">
          v1.0.0
        </span>
        <div class="flex gap-2">
          <!-- Manual Check For Update -->
          <button title="Check for update" class="p-2.5 text-gray-600 bg-gray-100 hover:bg-black hover:text-white border-2 border-transparent hover:border-black transition-all rounded-none">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
          </button>
          
          <!-- Logout Button -->
          <button title="Logout" class="p-2.5 text-red-600 bg-red-50 hover:bg-red-600 hover:text-white border-2 border-transparent hover:border-red-600 transition-all rounded-none">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5.636 5.636a9 9 0 1012.728 0M12 3v9" />
            </svg>
          </button>
        </div>
      </div>

    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 p-8 bg-gray-50">
      <h2 class="text-2xl font-extrabold uppercase">Sidebar Drawer Shell</h2>
      <p class="text-gray-500 font-semibold mt-1">This sidebar navigation contains a clean neobrutalist drawer with modular bottom controls.</p>
    </div>
  </div>

</body>
</html>
