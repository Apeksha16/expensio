<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neobrutalist Confirm Modal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
    .animate-zoom-in {
      animation: zoomIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }
    @keyframes zoomIn {
      from { transform: scale(0.95); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body class="bg-[#f8fafc] p-8 text-[#0f172a] h-screen flex flex-col justify-between">
  <div class="max-w-4xl mx-auto w-full space-y-8 bg-white p-8 border-2 border-black">
    <div>
      <h1 class="text-3xl font-extrabold tracking-tight uppercase">Confirm Modal</h1>
      <p class="text-gray-500 font-semibold mt-1">Expensio Neobrutalist Confirmation Sheet/Dialog</p>
    </div>

    <button onclick="openModal()" class="font-bold rounded-none transition-all duration-200 active:scale-[0.98] px-6 py-2.5 bg-red-600 text-white border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:bg-red-700">
      Trigger Delete Dialog
    </button>

    <!-- Modal Container -->
    <div id="modal-container" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
      <!-- Backdrop -->
      <div onclick="closeModal()" class="fixed inset-0 bg-black/60 backdrop-blur-sm transition-opacity"></div>

      <!-- Modal Panel -->
      <div class="relative w-full max-w-sm bg-white border-2 border-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] p-6 z-10 animate-zoom-in text-left">
        <!-- Close trigger -->
        <button onclick="closeModal()" type="button" class="absolute top-4 right-4 text-gray-500 hover:text-black focus:outline-none">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>

        <h3 class="text-lg font-extrabold uppercase tracking-tight text-black mb-2">Delete Expense?</h3>
        
        <p class="text-sm font-semibold text-gray-500 leading-relaxed mb-6">
          Are you sure you want to delete this expense? This action cannot be undone and will update your category budgets.
        </p>

        <!-- Footer Buttons (Forest Green primary style) -->
        <div class="flex flex-col gap-2.5">
          <button onclick="closeModal()" class="font-medium rounded-none transition-all duration-200 active:scale-[0.98] flex justify-center items-center px-4 py-2 text-sm min-h-[44px] bg-[#1a2e22] hover:bg-[#2f4d3b] text-white focus:shadow-[inset_0_0_0_2px_#1a2e22,inset_0_0_0_4px_rgba(255,255,255,0.8)] border-0 w-full">
            Yes, Delete It
          </button>
          
          <button onclick="closeModal()" class="font-bold rounded-none transition-all duration-200 active:scale-[0.98] flex justify-center items-center px-4 py-2 text-sm min-h-[44px] bg-white hover:bg-gray-50 text-black border-2 border-black w-full">
            Cancel
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const modal = document.getElementById('modal-container');

    function openModal() {
      modal.classList.remove('hidden');
      document.body.classList.add('overflow-hidden');
    }

    function closeModal() {
      modal.classList.add('hidden');
      document.body.classList.remove('overflow-hidden');
    }

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape' && !modal.classList.contains('hidden')) {
        closeModal();
      }
    });
  </script>
</body>
</html>
