<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Popup (Modal) Component</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8 font-sans h-screen">
  <div class="max-w-4xl mx-auto space-y-8">
    <h1 class="text-2xl font-bold mb-4">Popup (Modal) Component</h1>

    <button onclick="openModal()" class="bg-[#1a2e22] text-white px-4 py-2 text-sm font-medium hover:bg-[#2f4d3b]">Open Modal</button>

    <!-- Modal Container -->
    <div id="modal" class="hidden fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
      <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
        
        <!-- Backdrop -->
        <div class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm transition-opacity" aria-hidden="true" onclick="closeModal()"></div>

        <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

        <!-- Modal Panel -->
        <div class="relative inline-block align-bottom bg-white text-left shadow-xl transform transition-all sm:my-8 sm:align-middle sm:w-full border border-gray-200 sm:max-w-lg">
          
          <!-- Header -->
          <div class="bg-gray-50/50 px-4 py-3 sm:px-6 border-b border-gray-100 flex justify-between items-center">
            <h3 class="text-sm font-semibold text-gray-900 uppercase tracking-wide" id="modal-title">Modal Title</h3>
            <button onclick="closeModal()" type="button" class="text-gray-400 hover:text-gray-500 focus:outline-none">
              <span class="sr-only">Close</span>
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>

          <!-- Content -->
          <div class="px-4 pt-5 pb-4 sm:p-6 sm:pb-4 text-sm text-gray-600">
            <p>This is the modal content area. You can put any HTML inside here, including forms, text, images, etc.</p>
          </div>

          <!-- Footer -->
          <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse gap-2">
            <button onclick="closeModal()" type="button" class="w-full inline-flex justify-center border border-transparent shadow-sm px-4 py-2 bg-[#1a2e22] text-base font-medium text-white hover:bg-[#2f4d3b] focus:outline-none focus:ring-0 sm:w-auto sm:text-sm">
              Confirm
            </button>
            <button onclick="closeModal()" type="button" class="mt-3 w-full inline-flex justify-center border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-0 sm:mt-0 sm:w-auto sm:text-sm">
              Cancel
            </button>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script>
    const modal = document.getElementById('modal');

    function openModal() {
      modal.classList.remove('hidden');
      document.body.classList.add('overflow-hidden');
    }

    function closeModal() {
      modal.classList.add('hidden');
      document.body.classList.remove('overflow-hidden');
    }

    // Close on escape key
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape' && !modal.classList.contains('hidden')) {
        closeModal();
      }
    });
  </script>
</body>
</html>
