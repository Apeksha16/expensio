<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neobrutalist Transaction List / Table</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-[#f8fafc] p-8 text-[#0f172a]">
  <div class="max-w-4xl mx-auto space-y-8">
    <div>
      <h1 class="text-3xl font-extrabold tracking-tight uppercase">Tables & Lists</h1>
      <p class="text-gray-500 font-semibold mt-1">Expensio Neobrutalist Transaction Lists and Tables</p>
    </div>

    <!-- Neobrutalist Transaction Card List (Expensio style for transactions) -->
    <div class="bg-white border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] flex flex-col overflow-hidden">
      <!-- Table Header / Sorting Bar -->
      <div class="bg-gray-100 border-b-2 border-black flex items-center justify-between p-4 sticky top-0 z-10">
        <span class="text-xs font-black uppercase tracking-wider text-black">Recent Expenses</span>
        <button class="flex items-center gap-1.5 text-xs font-bold text-gray-500 hover:text-black uppercase">
          Sort by Date
          <span class="text-black">↓</span>
        </button>
      </div>

      <!-- Transaction Rows -->
      <div class="divide-y-2 divide-black">
        
        <!-- Transaction Row 1 (UPI/Expense context) -->
        <div class="p-4 flex items-center justify-between hover:bg-gray-50 transition-colors">
          <div class="flex items-center gap-3">
            <!-- category colored border icon wrapper -->
            <div class="w-10 h-10 border-2 border-black bg-[#eff6ff] flex items-center justify-center text-[#3b82f6]">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 009 11V7a1.996 1.996 0 013.185-1.595m0 0A1.996 1.996 0 0018 7v4c0 1.258.208 2.468.59 3.6m-.59-5.6l-.089-.047A3.354 3.354 0 0015 7.5a3.354 3.354 0 00-2.316-.947" />
              </svg>
            </div>
            <div>
              <h4 class="text-sm font-extrabold text-black uppercase tracking-tight">Spotify Premium</h4>
              <p class="text-[10px] text-gray-500 font-semibold uppercase mt-0.5">Subscriptions • UPI • Oct 24, 2023</p>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-sm font-black text-black">₹179.00</span>
            <button class="p-1 border border-black hover:bg-red-50 hover:text-red-600 transition-colors rounded-none" title="Delete">
              <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Transaction Row 2 (Food/Cash context) -->
        <div class="p-4 flex items-center justify-between hover:bg-gray-50 transition-colors">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 border-2 border-black bg-[#ecfdf5] flex items-center justify-center text-[#10b981]">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707-.707M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </div>
            <div>
              <h4 class="text-sm font-extrabold text-black uppercase tracking-tight">Dominos Pizza</h4>
              <p class="text-[10px] text-gray-500 font-semibold uppercase mt-0.5">Food & Dining • Cash • Oct 25, 2023</p>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-sm font-black text-black">₹499.00</span>
            <button class="p-1 border border-black hover:bg-red-50 hover:text-red-600 transition-colors rounded-none" title="Delete">
              <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>
          </div>
        </div>

      </div>

      <!-- Pagination / View More Strip -->
      <div class="border-t-2 border-black bg-gray-50 p-4 flex items-center justify-between">
        <span class="text-xs text-gray-500 font-semibold">Showing 2 expenses</span>
        <button class="text-xs font-black uppercase tracking-wider text-black hover:underline">
          View All Transactions →
        </button>
      </div>

    </div>
  </div>
</body>
</html>
