<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neobrutalist Date Picker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
    /* Hide scrollbar for horizontal scroll */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#f8fafc] p-8 text-[#0f172a]">
  <div class="max-w-md mx-auto space-y-6 bg-white p-6 border-2 border-black">
    <div>
      <h1 class="text-xl font-black uppercase tracking-tight">Select Date</h1>
      <p class="text-xs text-gray-500 font-semibold mt-0.5">Expensio-styled calendar selection component.</p>
    </div>

    <!-- Scrollable Month Strip -->
    <div class="flex gap-2 overflow-x-auto no-scrollbar border-b-2 border-black pb-3 select-none">
      <button class="flex-shrink-0 text-xs font-bold uppercase py-1.5 px-3 border border-black hover:bg-gray-50">Sep 2023</button>
      <button class="flex-shrink-0 text-xs font-black uppercase py-1.5 px-3 border-2 border-black bg-[#3b82f6] text-white">Oct 2023</button>
      <button class="flex-shrink-0 text-xs font-bold uppercase py-1.5 px-3 border border-black hover:bg-gray-50">Nov 2023</button>
      <button class="flex-shrink-0 text-xs font-bold uppercase py-1.5 px-3 border border-black hover:bg-gray-50">Dec 2023</button>
    </div>

    <!-- Calendar Grid Headers -->
    <div class="grid grid-cols-7 text-center gap-1.5 text-[10px] font-black text-gray-400 uppercase tracking-widest mt-2">
      <div>Su</div>
      <div>Mo</div>
      <div>Tu</div>
      <div>We</div>
      <div>Th</div>
      <div>Fr</div>
      <div>Sa</div>
    </div>

    <!-- Calendar Day Grid -->
    <div class="grid grid-cols-7 text-center gap-1.5 font-bold mt-2" id="day-grid">
      <!-- Empty space for month start padding -->
      <div class="p-2 text-gray-300">29</div>
      <div class="p-2 text-gray-300">30</div>
      
      <!-- Days -->
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">1</button>
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">2</button>
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">3</button>
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">4</button>
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">5</button>
      
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">6</button>
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">7</button>
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">8</button>
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">9</button>
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">10</button>
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">11</button>
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">12</button>

      <!-- Active Selected Day (Themed blue focus) -->
      <button class="p-2 border-2 border-black bg-[#3b82f6] text-white text-sm">13</button>
      
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">14</button>
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">15</button>
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">16</button>
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">17</button>
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">18</button>
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">19</button>
      
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">20</button>
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">21</button>
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">22</button>
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">23</button>
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">24</button>
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">25</button>
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">26</button>
      
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">27</button>
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">28</button>
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">29</button>
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">30</button>
      <button class="p-2 border border-transparent hover:border-black hover:bg-gray-50 text-sm">31</button>
      
      <div class="p-2 text-gray-300">1</div>
      <div class="p-2 text-gray-300">2</div>
    </div>
  </div>
</body>
</html>
