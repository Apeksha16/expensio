<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neobrutalist Amount Input (Indian Number System)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-[#f8fafc] p-8 text-[#0f172a]">
  <div class="max-w-md mx-auto space-y-8 bg-white p-8 border-2 border-black">
    <div>
      <h1 class="text-2xl font-black uppercase tracking-tight">Amount Input</h1>
      <p class="text-sm text-gray-500 font-semibold mt-1">Real-time Indian numbering system comma formatter (Intl.NumberFormat en-IN).</p>
    </div>

    <!-- Amount input container -->
    <div class="flex flex-col gap-2">
      <label class="text-xs font-bold text-gray-700 uppercase tracking-wider">Salary or Amount</label>
      <div class="relative w-full">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <span class="text-gray-500 font-bold text-[16px]">₹</span>
        </div>
        <input
          id="amount-field"
          type="text"
          placeholder="0.00"
          class="w-full bg-gray-50 border-2 border-black text-black font-bold p-3 pl-8 pr-12 rounded-none focus:outline-none placeholder-gray-500 min-h-[44px] touch-manipulation text-[16px]"
        />
        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
          <span class="text-gray-400 font-bold text-xs uppercase">INR</span>
        </div>
      </div>
    </div>

    <button onclick="getRawValue()" class="font-medium rounded-none flex justify-center items-center px-4 py-3 text-sm min-h-[44px] bg-[#1a2e22] hover:bg-[#2f4d3b] text-white focus:outline-none w-full">
      Get Raw Float Value
    </button>
  </div>

  <script>
    const amountField = document.getElementById('amount-field');

    amountField.addEventListener('input', (event) => {
      const inputEl = event.target;
      let selectionStart = inputEl.selectionStart || 0;
      
      const value = inputEl.value;
      const beforeCursor = value.substring(0, selectionStart);
      const charsBeforeCursor = beforeCursor.replace(/[^0-9.]/g, '').length;

      let rawValue = value.replace(/[^0-9.]/g, '');
      
      // Ensure only one dot exists
      const parts = rawValue.split('.');
      if (parts.length > 2) {
        rawValue = parts[0] + '.' + parts.slice(1).join('');
      }
      
      // Limit to 2 decimal places
      const finalParts = rawValue.split('.');
      if (finalParts.length === 2 && finalParts[1].length > 2) {
        rawValue = finalParts[0] + '.' + finalParts[1].substring(0, 2);
      }

      let formatted = '';
      if (rawValue) {
        const numParts = rawValue.split('.');
        const integerPart = numParts[0] ? parseInt(numParts[0], 10) : 0;
        
        // Indian Numbering System formatting (en-IN)
        formatted = new Intl.NumberFormat('en-IN').format(integerPart);
        if (numParts.length > 1) {
          formatted += '.' + numParts[1];
        }
      }

      inputEl.value = formatted;
      
      // Restore cursor position
      let newCursorPos = 0;
      let charsSeen = 0;
      for (let i = 0; i < formatted.length; i++) {
        if (/[0-9.]/.test(formatted[i])) {
          charsSeen++;
        }
        if (charsSeen === charsBeforeCursor) {
          newCursorPos = i + 1;
          break;
        }
      }
      
      if (charsBeforeCursor === 0) {
        newCursorPos = 0;
      }
      
      inputEl.setSelectionRange(newCursorPos, newCursorPos);
    });

    function getRawValue() {
      const formatted = amountField.value;
      const raw = parseFloat(formatted.replace(/[^0-9.]/g, '')) || 0.0;
      alert('Raw numeric value: ' + raw);
    }
  </script>
</body>
</html>
