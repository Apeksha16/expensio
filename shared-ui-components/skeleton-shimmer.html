<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neobrutalist Shimmer Skeletons</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-[#f8fafc] p-8 text-[#0f172a]">
  <div class="max-w-md mx-auto space-y-6">
    <div>
      <h1 class="text-2xl font-black uppercase tracking-tight">Skeleton Loading</h1>
      <p class="text-xs text-gray-500 font-semibold mt-0.5">Expensio-styled pulsing loading skeleton cards.</p>
    </div>

    <!-- Stats Card Loading Skeleton (Expensio style) -->
    <div class="bg-white p-6 border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] relative overflow-hidden space-y-4">
      <!-- Title Pulsing Bar -->
      <div class="h-3 bg-gray-200 animate-pulse w-24"></div>
      
      <!-- Big Value Pulsing Bar -->
      <div class="h-8 bg-gray-200 animate-pulse w-48 mt-2"></div>
      
      <!-- Bottom helper block -->
      <div class="pt-4 border-t border-gray-200 flex justify-between items-center">
        <div class="h-2 bg-gray-200 animate-pulse w-14"></div>
        <div class="h-2 bg-gray-200 animate-pulse w-14"></div>
      </div>
    </div>

    <!-- List Row Loading Skeleton (Expensio style) -->
    <div class="bg-white border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] p-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <!-- Circular Avatar/Icon Skeleton -->
        <div class="w-10 h-10 border-2 border-black bg-gray-200 animate-pulse"></div>
        
        <!-- Text lines -->
        <div class="space-y-1.5">
          <div class="h-3 bg-gray-200 animate-pulse w-32"></div>
          <div class="h-2 bg-gray-200 animate-pulse w-20"></div>
        </div>
      </div>

      <!-- Right side price block skeleton -->
      <div class="h-4 bg-gray-200 animate-pulse w-16"></div>
    </div>

  </div>
</body>
</html>
