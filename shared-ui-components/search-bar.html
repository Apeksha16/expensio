<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Bar Component</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8 font-sans">
  <div class="max-w-xl mx-auto space-y-8 bg-white p-8 border border-gray-200">
    <h1 class="text-2xl font-bold mb-4">Search Bar Component</h1>

    <!-- Normal Search Bar -->
    <div class="flex-1 w-full">
      <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Search</label>
      <div class="relative">
        <input type="text"
            placeholder="Search description or customer..."
            class="w-full border border-gray-200 bg-white text-sm px-4 py-2.5 outline-none focus:border-black focus:ring-0 transition-colors placeholder-gray-400 hover:border-gray-300">
      </div>
    </div>

    <!-- Disabled Search Bar -->
    <div class="flex-1 w-full">
      <label class="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Search (Disabled)</label>
      <div class="relative">
        <input type="text"
            placeholder="Search unavailable..."
            disabled
            class="w-full border border-gray-200 bg-gray-50 text-sm px-4 py-2.5 outline-none focus:border-black focus:ring-0 transition-colors placeholder-gray-400 opacity-60 cursor-not-allowed">
      </div>
    </div>
  </div>
</body>
</html>
