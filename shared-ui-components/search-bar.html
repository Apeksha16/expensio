<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neobrutalist Search Bar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-[#f8fafc] p-8 text-[#0f172a]">
  <div class="max-w-md mx-auto space-y-8 bg-white p-8 border-2 border-black">
    <div>
      <h1 class="text-3xl font-extrabold tracking-tight uppercase">Search Bar</h1>
      <p class="text-gray-500 font-semibold mt-1">Expensio Neobrutalist Search Inputs</p>
    </div>

    <!-- Active Search Bar -->
    <div class="flex flex-col gap-2">
      <label class="text-xs font-bold text-gray-700 uppercase tracking-wider">Search Transactions</label>
      <div class="relative w-full">
        <input
          type="text"
          placeholder="Search by title or category..."
          class="w-full bg-gray-50 border-2 border-black text-black font-bold p-3 pr-10 rounded-none focus:outline-none placeholder-gray-500 min-h-[44px] touch-manipulation text-[16px]"
        />
        <!-- Search Icon -->
        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
          <svg class="h-5 w-5 text-black" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Disabled State -->
    <div class="flex flex-col gap-2">
      <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Filters Locked (Disabled)</label>
      <div class="relative w-full">
        <input
          type="text"
          disabled
          placeholder="Filters currently unavailable"
          class="w-full bg-gray-100 border-2 border-gray-300 text-gray-400 font-bold p-3 pr-10 rounded-none cursor-not-allowed opacity-60 min-h-[44px] text-[16px]"
        />
        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
          <svg class="h-5 w-5 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
