<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neobrutalist Semicircle Gauge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
    /* Simple SVG circular animation logic */
    .gauge-circle {
      transition: stroke-dashoffset 0.6s ease-out;
    }
  </style>
</head>
<body class="bg-[#f8fafc] p-8 text-[#0f172a]">
  <div class="max-w-sm mx-auto space-y-6 bg-white p-6 border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
    <div>
      <h2 class="text-xs font-black uppercase text-gray-400 tracking-widest text-center">Monthly Spending</h2>
    </div>

    <!-- Semicircular Gauge (using custom CSS border-radius clip and rotation or SVG) -->
    <!-- Expensio uses an SVG path or a custom CSS semicircle widget. Here's a clean SVG implementation representing 70% fill -->
    <div class="relative flex items-center justify-center h-40">
      <svg class="w-full h-full transform -rotate-180" viewBox="0 0 100 50">
        <!-- Background Semicircle Arc -->
        <path
          d="M 10 50 A 40 40 0 0 1 90 50"
          fill="none"
          stroke="#f3f4f6"
          stroke-width="12"
          stroke-linecap="square"
          class="border border-black"
        />
        <!-- Progress Semicircle Arc (70% fill) -->
        <path
          d="M 10 50 A 40 40 0 0 1 90 50"
          fill="none"
          stroke="#3b82f6"
          stroke-width="12"
          stroke-linecap="square"
          stroke-dasharray="125.6"
          stroke-dashoffset="37.68"
          class="gauge-circle"
        />
      </svg>

      <!-- Center Values text absolute position -->
      <div class="absolute bottom-2 flex flex-col items-center">
        <span class="text-xs font-black text-gray-400 uppercase tracking-widest">Total Spent</span>
        <span class="text-2xl font-black mt-0.5">₹35,000</span>
        <span class="text-[10px] text-gray-500 font-semibold uppercase mt-0.5">of ₹50,000 Salary</span>
      </div>
    </div>

    <!-- Bottom Stat Splits -->
    <div class="flex justify-between items-center border-t-2 border-black pt-4">
      <div>
        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Invested / Saved</p>
        <p class="text-sm font-black text-[#10b981]">₹10,000</p>
      </div>
      <div class="text-right">
        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Remaining Balance</p>
        <p class="text-sm font-black text-gray-900">₹5,000</p>
      </div>
    </div>
  </div>
</body>
</html>
