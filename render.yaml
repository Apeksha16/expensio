services:
  - type: web
    name: expensio-api
    env: node
    plan: free
    # Since this is a turborepo, we build from the root directory
    buildCommand: npm install && npx turbo run build --filter=api
    startCommand: npm start --workspace=api
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0 # Required for Render to route traffic properly
      - key: PORT
        value: 10000
      # The following variables will need to be provided in the Render Dashboard
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: MEILISEARCH_URL
        sync: false
      - key: MEILISEARCH_MASTER_KEY
        sync: false
