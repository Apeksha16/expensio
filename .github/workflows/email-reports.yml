name: Automated Email Reports

on:
  schedule:
    # Run every Monday at 8:00 AM UTC for weekly reports
    - cron: '0 8 * * 1'
    # Run on the 1st of every month at 8:00 AM UTC for monthly reports
    - cron: '0 8 1 * *'
  workflow_dispatch:
    inputs:
      type:
        description: 'Report Type (weekly or monthly)'
        required: true
        default: 'weekly'
        type: choice
        options:
          - weekly
          - monthly

jobs:
  send-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Determine Report Type
        id: set-type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.type }}" >> $GITHUB_OUTPUT
          elif [ "$(date +%d)" = "01" ]; then
            echo "type=monthly" >> $GITHUB_OUTPUT
          else
            echo "type=weekly" >> $GITHUB_OUTPUT
          fi

      - name: Invoke Supabase Edge Function
        run: |
          curl -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/send-email-reports" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"type\": \"${{ steps.set-type.outputs.type }}\"}"
