name: Automated Email Reports

on:
  schedule:
    # Run twice daily at 10:00 AM and 10:00 PM (4:30 AM & 4:30 PM UTC for IST)
    - cron: '30 4,16 * * *'
    # Run every Monday for weekly reports
    - cron: '0 8 * * 1'
    # Run on 1st of month for monthly reports
    - cron: '0 8 1 * *'
  workflow_dispatch:
    inputs:
      type:
        description: 'Report Type (twice_daily, weekly, or monthly)'
        required: true
        default: 'twice_daily'
        type: choice
        options:
          - twice_daily
          - weekly
          - monthly

jobs:
  send-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Determine Report Type
        id: set-type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.type }}" >> $GITHUB_OUTPUT
          elif [ "$(date +%d)" = "01" ]; then
            echo "type=monthly" >> $GITHUB_OUTPUT
          elif [ "$(date +%u)" = "1" ]; then
            echo "type=weekly" >> $GITHUB_OUTPUT
          else
            echo "type=twice_daily" >> $GITHUB_OUTPUT
          fi

      - name: Invoke Supabase Edge Function
        run: |
          curl -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/send-email-reports" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"type\": \"${{ steps.set-type.outputs.type }}\"}"
